services:
  hummingbot:
    container_name: hummingbot
    image: hummingbot/hummingbot:latest
    # build: # Uncomment this build section and comment image to build Hummingbot locally
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      - ./conf:/home/andrew/data/hummingbot/conf
      - ./conf/connectors:/home/andrew/data/hummingbot/conf/connectors
      - ./conf/strategies:/home/andrew/data/hummingbot/conf/strategies
      - ./conf/controllers:/home/andrew/data/hummingbot/conf/controllers
      - ./conf/scripts:/home/andrew/data/hummingbot/conf/scripts
      - ./logs:/home/andrew/data/hummingbot/logs
      - ./data:/home/andrew/data/hummingbot/data
      - ./certs:/home/andrew/data/hummingbot/certs
      - ./scripts:/home/andrew/data/hummingbot/scripts
      - ./controllers:/home/andrew/data/hummingbot/controllers
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    tty: true
    stdin_open: true
    network_mode: host
    environment:
      - CONFIG_PASSWORD=admin
      - CONFIG_FILE_NAME=v2_with_controllers.py
      - SCRIPT_CONFIG=conf_v2_with_controllers.yml

  gateway:
    restart: always
    container_name: gateway
    image: hummingbot/gateway:latest
    ports:
      - "15888:15888"
    volumes:
      - "./gateway-files/conf:/home/gateway/conf"
      - "./gateway-files/logs:/home/gateway/logs"
      - "./certs:/home/gateway/certs"
    environment:
      - GATEWAY_PASSPHRASE=admin
      - DEV=true
